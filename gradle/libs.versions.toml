[versions]
kotlin = "2.1.10"
kotlinx-coroutines = "1.10.1"

[libraries]
kotlin-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

maven-publish-gradlePlugin = "com.vanniktech:gradle-maven-publish-plugin:0.31.0"
dokka-gradlePlugin = "org.jetbrains.dokka:dokka-gradle-plugin:2.0.0"
binary-compatibility-validator-gradlePlugin = "org.jetbrains.kotlinx:binary-compatibility-validator:0.17.0"
spotless-gradlePlugin = "com.diffplug.spotless:spotless-plugin-gradle:7.0.2"
ktlint-core = "com.pinterest.ktlint:ktlint-cli:1.5.0"

assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
